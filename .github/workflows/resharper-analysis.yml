name: ReSharper Code Analysis

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "master"
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-code:
    name: ReSharper InspectCode
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup .NET environment
      uses: ./.github/actions/dotnet-setup

    - name: ReSharper CLI InspectCode
      uses: muno92/resharper_inspectcode@96099943114475cbc62337f76b8c5869f0859310 # 1.17.7
      with:
        solutionPath: ./Rivulet.slnx
        version: 2025.3.3
        failOnIssue: '1'
        noBuild: false
        solutionWideAnalysis: true
        minimumReportSeverity: WARNING
        minimumSeverity: warning
        exclude: '**/obj/**;**/bin/**;**/TestResults/**;**/tests/**'
        properties: 'Configuration=Release'
